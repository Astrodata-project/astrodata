project_path: "."

code:
  enable: false
  auto_commit: true
  tracked_files: ["examples"]
  commit_message: "Auto commit by astrodata"
  branch: "main"
  remote:
    enable: true
    name: "origin"
    url: "changeme"
  # ssh_key_path: "your_key"  # Optional
  token: "your_token"

data:
  enable: false
  paths:
    - "testdata"
  remote: "/home/path/to/data" # Must be full path
  push: true

